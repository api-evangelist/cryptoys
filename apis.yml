name: Cryptoys
description: >-
  Cryptoys is an Andreessen Horowitz (a16z) backed Web3 digital collectibles
  company that lets fans buy, own, and play with blockchain-based interactive
  toys featuring licensed characters from Disney and Star Wars alongside
  original IP. Products are sold as blind boxes containing randomized digital
  toys across multiple power tiers and rarity levels. The company has since
  rebranded and now operates its consumer experience as Digitoys at
  digitoys.io, while retaining its identity account service at auth.cryptoys.com.
  Cryptoys is a consumer-facing collectibles platform and does not currently
  publish a public developer API, SDK, or developer portal; this profile
  captures its public web and identity surface for the API Evangelist network.
